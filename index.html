<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本史 一問一答アプリ（全82単元＋資料問題）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* フォントとベース設定 */
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #9CBDF5;
      color: #1E293B;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    /* 横スクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* カードのタップアニメーション */
    .tap-card {
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
    }
    .tap-card:active {
      transform: scale(0.97);
    }
    /* 答え表示時のアニメーション */
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop {
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#9CBDF5]">

  <!-- メインコンテナ（スマホアプリ風・PCでも見やすい最大幅） -->
  <div id="app" class="w-full max-w-2xl min-h-screen flex flex-col bg-[#9CBDF5] shadow-2xl relative overflow-x-hidden">

    <!-- ==================== ホーム画面 ==================== -->
    <div id="home-view" class="flex flex-col min-h-screen">
      
      <!-- 上部タブバー（白背景・横スクロール） -->
      <header class="bg-white/95 backdrop-blur sticky top-0 z-30 shadow-sm">
        <div id="tab-bar" class="flex overflow-x-auto no-scrollbar border-b border-blue-100 px-1">
          <!-- JSでタブを描画 -->
        </div>
      </header>

      <!-- ツールバー（設定 / 正解ポイント / 検索） -->
      <div class="px-3 pt-2.5 pb-2 flex items-center gap-2 sticky top-[45px] z-20 bg-[#9CBDF5]/95 backdrop-blur-sm">
        <!-- 設定ボタン -->
        <button id="btn-settings" aria-label="設定" class="w-11 h-11 rounded-2xl bg-white/85 hover:bg-white shadow-sm flex items-center justify-center text-slate-600 tap-card shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        <!-- 正解ポイントバー -->
        <div class="flex-1 bg-white/65 rounded-xl py-2.5 px-3 text-center shadow-inner border border-white/50">
          <span id="point-display" class="text-[#2563EB] font-semibold text-sm sm:text-base tracking-wide">
            正解ポイント：0
          </span>
        </div>

        <!-- 検索ボタン -->
        <button id="btn-search" aria-label="問題検索" class="w-11 h-11 rounded-2xl bg-white/85 hover:bg-white shadow-sm flex items-center justify-center text-slate-600 tap-card shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
          </svg>
        </button>
      </div>

      <!-- 表示切替サブバー（単元別 / 章別 & 難易度フィルタ表示） -->
      <div id="sub-controls" class="px-3 pb-2 flex items-center justify-between gap-2 text-xs">
        <div class="inline-flex bg-white/50 p-0.5 rounded-lg">
          <button id="mode-unit" class="px-3 py-1.5 rounded-md font-semibold transition-all">単元ごと</button>
          <button id="mode-chapter" class="px-3 py-1.5 rounded-md font-semibold transition-all">章ごと</button>
        </div>
        <div id="filter-badge" class="text-white/95 font-medium bg-blue-600/40 px-2.5 py-1 rounded-lg">
          全レベル・通常順
        </div>
      </div>

      <!-- メイン2列カードグリッド -->
      <main class="flex-1 px-2.5 pb-20">
        <div id="card-grid" class="grid grid-cols-2 gap-2">
          <!-- JSで単元/章カード、まとめ、復習リスト、マイリストを描画 -->
        </div>
      </main>

      <!-- 下部フッターバー（タブ切替・問題数表示） -->
      <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-2xl px-2.5 pb-2.5 pt-1 bg-gradient-to-t from-[#9CBDF5] via-[#9CBDF5]/90 to-transparent z-20">
        <div class="bg-[#E5E7EB]/95 backdrop-blur rounded-xl shadow-md flex items-center justify-between px-2 py-2.5 border border-white/60">
          <button id="btn-prev-tab" class="p-1.5 px-3 text-slate-600 hover:text-blue-600 font-bold tap-card rounded-lg" aria-label="前のタブ">◁</button>
          <div id="footer-status" class="text-xs sm:text-sm font-medium text-slate-700 text-center truncate px-2">
            <!-- JSで更新 -->
          </div>
          <button id="btn-next-tab" class="p-1.5 px-3 text-slate-600 hover:text-blue-600 font-bold tap-card rounded-lg" aria-label="次のタブ">▷</button>
        </div>
      </footer>
    </div>

    <!-- ==================== 学習（一問一答）画面 ==================== -->
    <div id="study-view" class="hidden flex-col min-h-screen bg-[#EDF3FC]">
      <!-- 学習ヘッダー -->
      <div class="bg-white shadow-sm px-3 py-3 flex items-center justify-between gap-2 sticky top-0 z-30">
        <button id="btn-back-home" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm flex items-center gap-1 tap-card">
          <span>←</span><span>戻る</span>
        </button>
        <div class="flex-1 text-center min-w-0">
          <div id="study-title" class="text-sm font-bold text-slate-800 truncate">単元名</div>
          <div id="study-progress-text" class="text-xs text-blue-600 font-semibold">1 / 20</div>
        </div>
        <button id="btn-toggle-star" class="w-11 h-11 rounded-xl bg-amber-50 hover:bg-amber-100 flex items-center justify-center text-2xl tap-card" aria-label="マイリスト登録">
          <span id="star-icon" class="text-slate-300">☆</span>
        </button>
      </div>

      <!-- プログレスバー -->
      <div class="w-full h-1.5 bg-blue-100">
        <div id="study-progress-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- 問題＆解答カードエリア -->
      <div class="flex-1 flex flex-col p-4 gap-4 max-w-xl w-full mx-auto">
        <!-- メタ情報行 -->
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span id="q-type-badge" class="px-2.5 py-1 rounded-full font-bold bg-blue-100 text-blue-700">基本</span>
            <span id="q-unit-badge" class="px-2.5 py-1 rounded-full font-medium bg-white text-slate-600 border border-slate-200">単元1</span>
          </div>
          <span id="q-review-tag" class="hidden px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-semibold">復習リスト</span>
        </div>

        <!-- タップ可能なメインフラッシュカード -->
        <div id="flashcard" class="flex-1 bg-white rounded-3xl shadow-md border border-blue-100 p-5 sm:p-7 flex flex-col justify-between cursor-pointer select-none tap-card min-h-[300px]">
          <div>
            <!-- 史料・資料コンテキスト枠（資料問題のみ表示） -->
            <div id="q-source-box" class="hidden mb-4 p-3.5 rounded-2xl bg-amber-50/80 border border-amber-200 text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line"></div>

            <!-- 問題文 -->
            <div class="text-xs font-bold text-blue-500 mb-2 tracking-wider">QUESTION</div>
            <p id="q-text" class="text-lg sm:text-xl font-bold text-slate-800 leading-relaxed"></p>
          </div>

          <!-- 答え表示エリア -->
          <div class="mt-6 pt-5 border-t border-dashed border-slate-200">
            <!-- 未表示時のヒント -->
            <div id="answer-placeholder" class="py-6 text-center rounded-2xl bg-blue-50/70 border border-blue-100 text-blue-600 font-semibold text-sm sm:text-base flex flex-col items-center gap-1">
              <span>👆 タップ / クリックして答えを見る</span>
              <span class="text-[11px] text-blue-400 font-normal">（PCは Space / Enter キーでもOK）</span>
            </div>

            <!-- 表示時の答え -->
            <div id="answer-revealed" class="hidden animate-pop">
              <div class="text-xs font-bold text-rose-500 mb-1.5 tracking-wider">ANSWER</div>
              <div id="a-text" class="text-2xl sm:text-3xl font-extrabold text-rose-600 leading-snug break-words"></div>
              <p id="a-note" class="hidden mt-3 text-xs sm:text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 leading-relaxed"></p>
            </div>
          </div>
        </div>

        <!-- 下部操作ボタン -->
        <div class="pb-3">
          <!-- 答えを見る前のナビ -->
          <div id="pre-answer-actions" class="grid grid-cols-2 gap-3">
            <button id="btn-prev-q" class="py-3.5 rounded-2xl bg-white text-slate-600 font-bold shadow-sm border border-slate-200 tap-card">
              ← 前の問題
            </button>
            <button id="btn-show-ans" class="py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md tap-card">
              答えを見る
            </button>
          </div>

          <!-- 答えを見た後の判定ボタン -->
          <div id="post-answer-actions" class="hidden grid grid-cols-2 gap-3">
            <button id="btn-wrong" class="py-4 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold shadow-md flex flex-col items-center justify-center tap-card">
              <span class="text-base">× まだ</span>
              <span class="text-[11px] font-normal opacity-90">復習リストへ登録</span>
            </button>
            <button id="btn-correct" class="py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold shadow-md flex flex-col items-center justify-center tap-card">
              <span class="text-base">○ おぼえた！</span>
              <span class="text-[11px] font-normal opacity-90">正解ポイント +1</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== 結果サマリー画面 ==================== -->
    <div id="result-view" class="hidden flex-col min-h-screen bg-[#EDF3FC] items-center justify-center p-5">
      <div class="bg-white rounded-3xl shadow-lg p-7 w-full max-w-md text-center border border-blue-100 animate-pop">
        <div class="text-4xl mb-2">🎉</div>
        <h2 class="text-xl font-bold text-slate-800 mb-1">学習おつかれさまでした！</h2>
        <p id="result-subtitle" class="text-sm text-slate-500 mb-5"></p>

        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="bg-emerald-50 rounded-2xl p-4 border border-emerald-100">
            <div class="text-xs text-emerald-700 font-semibold mb-1">おぼえた</div>
            <div id="res-correct" class="text-3xl font-extrabold text-emerald-600">0</div>
          </div>
          <div class="bg-rose-50 rounded-2xl p-4 border border-rose-100">
            <div class="text-xs text-rose-700 font-semibold mb-1">まだ（復習へ）</div>
            <div id="res-wrong" class="text-3xl font-extrabold text-rose-500">0</div>
          </div>
        </div>

        <div class="flex flex-col gap-2.5">
          <button id="btn-retry-wrong" class="hidden w-full py-3.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold shadow-md tap-card">
            間違えた問題だけやり直す
          </button>
          <button id="btn-retry-all" class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md tap-card">
            もう一度挑戦する
          </button>
          <button id="btn-result-home" class="w-full py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold tap-card">
            ホーム画面へ戻る
          </button>
        </div>
      </div>
    </div>

    <!-- ==================== 設定モーダル ==================== -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-pop max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-5">
          <h3 class="text-lg font-bold text-slate-800">⚙ 学習設定</h3>
          <button id="btn-close-settings" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold">✕</button>
        </div>

        <div class="space-y-5 text-sm">
          <!-- 出題順序 -->
          <div>
            <div class="font-semibold text-slate-700 mb-2">出題順序</div>
            <div class="grid grid-cols-2 gap-2">
              <button data-setting="order" data-val="seq" class="setting-btn py-2.5 rounded-xl border font-semibold">通常順</button>
              <button data-setting="order" data-val="random" class="setting-btn py-2.5 rounded-xl border font-semibold">シャッフル</button>
            </div>
          </div>

          <!-- レベル絞り込み（資料タブ以外） -->
          <div>
            <div class="font-semibold text-slate-700 mb-2">出題レベル（通常タブ）</div>
            <div class="grid grid-cols-3 gap-2">
              <button data-setting="level" data-val="all" class="setting-btn py-2.5 rounded-xl border font-semibold">すべて</button>
              <button data-setting="level" data-val="basic" class="setting-btn py-2.5 rounded-xl border font-semibold">基本のみ</button>
              <button data-setting="level" data-val="std" class="setting-btn py-2.5 rounded-xl border font-semibold">標準のみ</button>
            </div>
          </div>

          <!-- 復習リスト挙動 -->
          <div class="flex items-center justify-between py-2 border-t border-slate-100">
            <div>
              <div class="font-semibold text-slate-700">正解で復習リストから解除</div>
              <div class="text-xs text-slate-400">「○おぼえた」で自動的に除外します</div>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="chk-auto-remove" class="sr-only peer" checked>
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
          </div>

          <!-- リセット -->
          <div class="pt-3 border-t border-slate-100">
            <button id="btn-ask-reset" class="w-full py-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-sm">
              学習記録・リストをリセットする
            </button>
            <div id="reset-confirm-box" class="hidden mt-3 p-3 rounded-xl bg-rose-50 border border-rose-200 text-center">
              <p class="text-xs text-rose-700 font-semibold mb-2">本当にすべての正解記録・リストを消去しますか？</p>
              <div class="flex gap-2 justify-center">
                <button id="btn-cancel-reset" class="px-4 py-1.5 rounded-lg bg-white text-slate-600 text-xs font-bold border">キャンセル</button>
                <button id="btn-do-reset" class="px-4 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-bold">消去する</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== 検索モーダル ==================== -->
    <div id="search-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full max-w-lg h-[85vh] rounded-t-3xl sm:rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col animate-pop">
        <div class="flex items-center gap-2 mb-3">
          <div class="relative flex-1">
            <input id="search-input" type="text" placeholder="用語・人名・年号・キーワードで検索..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-100 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none text-sm">
            <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
          </div>
          <button id="btn-close-search" class="px-3 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">閉じる</button>
        </div>
        <div id="search-meta" class="text-xs text-slate-500 mb-2 px-1">キーワードを入力してください（タップで答え表示）</div>
        <div id="search-results" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <!-- JSで検索結果を描画 -->
        </div>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-800/90 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg"></div>

  </div>

<script>
/**
 * ============================================================================
 * 日本史 一問一答データベース（全18章・全82単元＋資料問題）
 * ※ p.52（単元25基本）と p.102（単元50基本）は欠落のため除外
 *
 * コンパクト格納形式:
 *  ##章番号|単元番号|単元名|時代タブID
 *  問題文|解答   (基本問題)
 *  --            (区切り以降が標準問題)
 *  問題文|解答   (標準問題)
 * ============================================================================
 */
const CHAPTER_NAMES = {
  1: "第1章 日本文化のはじまり",
  2: "第2章 ヤマト政権の確立",
  3: "第3章 律令国家の成立",
  4: "第4章 貴族政治の時代",
  5: "第5章 院政と武士の台頭",
  6: "第6章 武家政権の成立",
  7: "第7章 武家社会の展開",
  8: "第8章 中世から近世へ",
  9: "第9章 幕藩体制の形成",
  10: "第10章 幕藩体制の変動",
  11: "第11章 近世から近代へ",
  12: "第12章 近代国家の確立",
  13: "第13章 近代国家の進展",
  14: "第14章 近代の産業と文化",
  15: "第15章 軍部の台頭と第二次世界大戦",
  16: "第16章 占領期の日本",
  17: "第17章 高度成長期の日本",
  18: "第18章 変動する世界の中の日本"
};

const TABS = [
  { id: "ancient", label: "古代", code: "A" },
  { id: "medieval", label: "中世", code: "B" },
  { id: "early_modern", label: "近世", code: "C" },
  { id: "modern1", label: "近代①", code: "D" },
  { id: "modern2", label: "近代②", code: "E" },
  { id: "contemporary", label: "現代", code: "F" },
  { id: "sources", label: "資料問題", code: "S" }
];

// 全82単元の基本・標準問題（p.52単元25基本・p.102単元50基本除く）
const RAW_DATA = `
##1|1|旧石器時代と縄文文化|ancient
1. 約200万年前から1万年前の更新世(洪積世)で、4回の氷期と3回の間氷期が繰り返された時代を何というか。|氷河時代
2. 現生人類を新人というが、①静岡県浜松市で発見された新人段階の人骨と②沖縄県八重瀬町で発見された新人段階の人骨を何というか。|①浜北人骨 ②港川人骨
3. 更新世の頃、石器を道具として使用し、おもに採集・狩猟を行っていた時代を何というか。|旧石器時代

// ============================================================================
// データパーサー（RAW_DATA と RAW_SOURCES をアプリ用オブジェクトへ展開）
// ============================================================================
const ALL_QUESTIONS = [];
const UNITS = []; // 通常単元リスト
const SOURCE_GROUPS = []; // 資料問題グループリスト

function parseDatabases() {
  // 1. 通常単元のパース
  const unitBlocks = RAW_DATA.trim().split(/^##/m).filter(Boolean);
  unitBlocks.forEach(block => {
    const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
    const header = lines[0].split('|');
    const chapter = parseInt(header[0], 10);
    const unitNum = parseInt(header[1], 10);
    const title = header[2];
    const tabId = header[3];

    const unitObj = {
      id: `u_${unitNum}`,
      chapter,
      unitNum,
      title,
      tabId,
      questionIds: []
    };

    let isStd = false;
    let qIdx = 0;
    for (let i = 1; i < lines.length; i++) {
      if (lines[i] === '--') {
        isStd = true;
        continue;
      }
      const sep = lines[i].indexOf('|');
      if (sep === -1) continue;
      const qText = lines[i].slice(0, sep).trim();
      const aText = lines[i].slice(sep + 1).trim();
      qIdx++;
      const qId = `q_${unitNum}_${isStd ? 's' : 'b'}_${qIdx}`;
      ALL_QUESTIONS.push({
        id: qId,
        tabId,
        chapter,
        unitNum,
        unitId: unitObj.id,
        unitTitle: `${unitNum}. ${title}`,
        level: isStd ? 'std' : 'basic',
        source: '',
        q: qText,
        a: aText,
        note: ''
      });
      unitObj.questionIds.push(qId);
    }
    UNITS.push(unitObj);
  });

  // 2. 資料問題のパース
  const srcBlocks = RAW_SOURCES.trim().split(/^@@/m).filter(Boolean);
  srcBlocks.forEach(block => {
    const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
    const header = lines[0].split('|');
    const groupId = header[0];
    const groupTitle = header[1];

    const groupObj = {
      id: groupId,
      title: groupTitle,
      tabId: 'sources',
      questionIds: []
    };

    let qIdx = 0;
    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].split('|');
      if (parts.length < 4) continue;
      const unitNum = parseInt(parts[0], 10);
      const sourceText = parts[1].replace(/§/g, '\n').trim();
      const qText = parts[2].trim();
      const aText = parts[3].trim();
      const noteText = (parts[4] || '').trim();
      qIdx++;
      const qId = `src_${groupId}_${qIdx}`;
      ALL_QUESTIONS.push({
        id: qId,
        tabId: 'sources',
        chapter: 0,
        unitNum,
        unitId: groupId,
        unitTitle: `単元${unitNum} 資料問題`,
        level: 'source',
        source: sourceText,
        q: qText,
        a: aText,
        note: noteText
      });
      groupObj.questionIds.push(qId);
    }
    SOURCE_GROUPS.push(groupObj);
  });
}

const QUESTION_MAP = {};

// ============================================================================
// 状態管理（LocalStorage永続化）
// ============================================================================
const STORAGE_KEY = 'nihonshi_qa_app_v1';

const defaultState = {
  activeTab: 'ancient',
  groupMode: 'unit', // 'unit' or 'chapter'
  settings: {
    order: 'seq', // 'seq' or 'random'
    level: 'all', // 'all', 'basic', 'std'
    autoRemoveReview: true
  },
  // ユーザー学習記録
  correctMap: {},   // { qId: count }
  reviewSet: {},    // { qId: true }
  starSet: {},      // { qId: true }
  lastStudied: {}   // { deckKey: timestamp_ms }
};

let appState = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    const parsed = JSON.parse(raw);
    return {
      ...defaultState,
      ...parsed,
      settings: { ...defaultState.settings, ...(parsed.settings || {}) },
      correctMap: parsed.correctMap || {},
      reviewSet: parsed.reviewSet || {},
      starSet: parsed.starSet || {},
      lastStudied: parsed.lastStudied || {}
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {
    console.warn('LocalStorage保存エラー:', e);
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    el.classList.add('hidden');
  }, 1800);
}

/**
 * サンプル画像と同じ「前回から ○日○時間○分」形式で経過時間をフォーマット
 */
function formatElapsed(ts) {
  if (!ts) return '未学習';
  const diffMs = Math.max(0, Date.now() - ts);
  const totalMin = Math.floor(diffMs / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  const pad = n => String(n).padStart(2, '0');
  if (days === 0 && hours === 0 && mins === 0) return 'たった今学習';
  return `前回から ${days}日${pad(hours)}時間${pad(mins)}分`;
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

/**
 * 現在の設定（レベル絞り込み）に応じて問題配列をフィルタリング
 */
function filterQuestionsBySetting(qIds, isSourceTab) {
  const list = qIds.map(id => QUESTION_MAP[id]).filter(Boolean);
  if (isSourceTab || appState.settings.level === 'all') return list;
  return list.filter(q => q.level === appState.settings.level);
}

/**
 * 指定タブ内の全問題（現在のレベル設定考慮）を取得
 */
function getTabQuestions(tabId) {
  const isSrc = tabId === 'sources';
  const allInTab = ALL_QUESTIONS.filter(q => q.tabId === tabId);
  if (isSrc || appState.settings.level === 'all') return allInTab;
  return allInTab.filter(q => q.level === appState.settings.level);
}

function countSolvedInIds(qIds) {
  let c = 0;
  for (const id of qIds) {
    if (appState.correctMap[id] > 0) c++;
  }
  return c;
}

function sumPointsInIds(qIds) {
  let sum = 0;
  for (const id of qIds) {
    sum += (appState.correctMap[id] || 0);
  }
  return sum;
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  TABS.forEach(tab => {
    const active = tab.id === appState.activeTab;
    const btn = document.createElement('button');
    btn.className = `px-4 py-3 text-sm font-semibold whitespace-nowrap relative transition-colors shrink-0 ${
      active ? 'text-[#2563EB]' : 'text-slate-400 hover:text-slate-600'
    }`;
    btn.textContent = tab.label;
    if (active) {
      const underline = document.createElement('span');
      underline.className = 'absolute bottom-0 left-2 right-2 h-[3px] bg-[#2563EB] rounded-t-full';
      btn.appendChild(underline);
    }
    btn.addEventListener('click', () => {
      appState.activeTab = tab.id;
      saveState();
      renderHome();
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
    bar.appendChild(btn);
  });
}

function renderSubControls() {
  const isSrc = appState.activeTab === 'sources';
  const modeUnitBtn = document.getElementById('mode-unit');
  const modeChapBtn = document.getElementById('mode-chapter');
  const filterBadge = document.getElementById('filter-badge');

  // 資料問題タブでは単元/章切替を隠す
  modeUnitBtn.parentElement.style.visibility = isSrc ? 'hidden' : 'visible';

  const activeCls = 'bg-white text-blue-600 shadow-xs';
  const idleCls = 'text-white/90 hover:text-white';
  modeUnitBtn.className = `px-3 py-1 rounded-md font-semibold transition-all ${appState.groupMode === 'unit' ? activeCls : idleCls}`;
  modeChapBtn.className = `px-3 py-1 rounded-md font-semibold transition-all ${appState.groupMode === 'chapter' ? activeCls : idleCls}`;

  const lvMap = { all: '全レベル', basic: '基本のみ', std: '標準のみ' };
  const ordMap = { seq: '通常順', random: 'シャッフル' };
  filterBadge.textContent = isSrc
    ? `資料問題・${ordMap[appState.settings.order]}`
    : `${lvMap[appState.settings.level]}・${ordMap[appState.settings.order]}`;
}

/**
 * カードDOMを生成するヘルパー
 */
function createDeckCard({ title, count, subLine1, subLine2, bgClass = 'bg-white/95 hover:bg-white', badgeDone = false, onClick }) {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = `${bgClass} rounded-2xl p-3.5 sm:p-4 shadow-sm border border-white/80 flex flex-col items-center justify-center text-center min-h-[104px] relative tap-card w-full`;

  // 学習済み（100%達成など）の右上アイコン（サンプル画像風）
  if (badgeDone) {
    const icon = document.createElement('span');
    icon.className = 'absolute top-2 right-2 text-[#3B82F6] text-xs font-bold';
    icon.title = '全問クリア済み';
    icon.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 20.66 7 20.66 17 12 22 3.34 17 3.34 7 12 2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>`;
    card.appendChild(icon);
  }

  const titleEl = document.createElement('div');
  titleEl.className = 'text-[#2563EB] font-semibold text-[13px] sm:text-[15px] leading-snug mb-2 break-words w-full';
  titleEl.textContent = `${title}: ${count}`;
  card.appendChild(titleEl);

  const metaEl = document.createElement('div');
  metaEl.className = 'text-[10px] sm:text-[11px] text-[#3B82F6]/90 leading-tight space-y-0.5';
  metaEl.innerHTML = `<div>${subLine1}</div>${subLine2 ? `<div>${subLine2}</div>` : ''}`;
  card.appendChild(metaEl);

  card.addEventListener('click', onClick);
  return card;
}

function renderHome() {
  renderTabs();
  renderSubControls();

  const tabObj = TABS.find(t => t.id === appState.activeTab) || TABS[0];
  const isSrc = tabObj.id === 'sources';
  const tabQs = getTabQuestions(tabObj.id);
  const tabQIds = tabQs.map(q => q.id);

  // 上部正解ポイントバー更新
  const tabPoints = sumPointsInIds(tabQIds);
  document.getElementById('point-display').textContent = `正解ポイント${tabObj.code}: ${tabPoints}`;

  // グリッド描画
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  const decks = [];

  if (isSrc) {
    // 資料問題タブ：時代グループごと
    SOURCE_GROUPS.forEach(grp => {
      const qs = filterQuestionsBySetting(grp.questionIds, true);
      decks.push({
        key: grp.id,
        title: grp.title,
        questions: qs
      });
    });
  } else if (appState.groupMode === 'unit') {
    // 単元ごとモード
    UNITS.filter(u => u.tabId === tabObj.id).forEach(u => {
      const qs = filterQuestionsBySetting(u.questionIds, false);
      if (qs.length === 0) return;
      decks.push({
        key: u.id,
        title: `${u.unitNum}. ${u.title}`,
        questions: qs
      });
    });
  } else {
    // 章ごとモード
    const chapterNums = [...new Set(UNITS.filter(u => u.tabId === tabObj.id).map(u => u.chapter))];
    chapterNums.forEach(chNum => {
      const unitIdsInCh = UNITS.filter(u => u.tabId === tabObj.id && u.chapter === chNum).flatMap(u => u.questionIds);
      const qs = filterQuestionsBySetting(unitIdsInCh, false);
      if (qs.length === 0) return;
      decks.push({
        key: `ch_${chNum}`,
        title: CHAPTER_NAMES[chNum] || `第${chNum}章`,
        questions: qs
      });
    });
  }

  // 各単元/章カードを追加
  decks.forEach(deck => {
    const ids = deck.questions.map(q => q.id);
    const solved = countSolvedInIds(ids);
    const points = sumPointsInIds(ids);
    const elapsed = formatElapsed(appState.lastStudied[deck.key]);
    const isAllCleared = ids.length > 0 && solved === ids.length;

    grid.appendChild(createDeckCard({
      title: deck.title,
      count: deck.questions.length,
      subLine1: elapsed,
      subLine2: points > 0 ? `正解数: ${points}（到達 ${solved}/${ids.length}）` : '',
      badgeDone: isAllCleared,
      onClick: () => startStudy(deck.key, deck.title, deck.questions)
    }));
  });

  // 「まとめ」カード（このタブの全問題）
  const summaryKey = `summary_${tabObj.id}`;
  const summarySolved = countSolvedInIds(tabQIds);
  grid.appendChild(createDeckCard({
    title: 'まとめ',
    count: tabQs.length,
    subLine1: formatElapsed(appState.lastStudied[summaryKey]),
    subLine2: `正解数: ${tabPoints}（到達 ${summarySolved}/${tabQs.length}）`,
    badgeDone: tabQs.length > 0 && summarySolved === tabQs.length,
    onClick: () => startStudy(summaryKey, `${tabObj.label} まとめ`, tabQs)
  }));

  // グリッドの左右バランス調整（偶数に揃える場合、空きスペーサーを入れて復習＆マイリストを下段2列に揃える）
  if (grid.children.length % 2 === 1) {
    const spacer = document.createElement('div');
    spacer.className = 'hidden sm:block';
    // モバイルでも下段を綺麗に2列並べるため空セルを配置
    spacer.className = 'min-h-[10px]';
    grid.appendChild(spacer);
  }

  // 「復習リスト」（淡い緑：サンプル画像再現）
  const reviewQs = tabQs.filter(q => appState.reviewSet[q.id]);
  const reviewKey = `review_${tabObj.id}`;
  grid.appendChild(createDeckCard({
    title: `復習リスト${tabObj.code}`,
    count: reviewQs.length,
    subLine1: formatElapsed(appState.lastStudied[reviewKey]),
    subLine2: '*誤答を自動で登録しています',
    bgClass: 'bg-[#D9FBD0] hover:bg-[#ccf8c0]',
    onClick: () => {
      if (reviewQs.length === 0) {
        showToast('このタブの復習リストは空です！');
        return;
      }
      startStudy(reviewKey, `復習リスト${tabObj.code}（${tabObj.label}）`, reviewQs);
    }
  }));

  // 「マイリスト」（淡いオレンジ：サンプル画像再現）
  const starQs = tabQs.filter(q => appState.starSet[q.id]);
  const starKey = `star_${tabObj.id}`;
  grid.appendChild(createDeckCard({
    title: `マイリスト${tabObj.code}`,
    count: starQs.length,
    subLine1: formatElapsed(appState.lastStudied[starKey]),
    subLine2: '☆マークした問題を登録',
    bgClass: 'bg-[#FDEBD0] hover:bg-[#fce0b8]',
    onClick: () => {
      if (starQs.length === 0) {
        showToast('☆マークで問題をマイリストに登録できます');
        return;
      }
      startStudy(starKey, `マイリスト${tabObj.code}（${tabObj.label}）`, starQs);
    }
  }));

  // 下部フッターバー更新
  document.getElementById('footer-status').textContent = `${tabObj.label}: ${tabQs.length}問（全${ALL_QUESTIONS.length}問収録）`;
}

// ============================================================================
// 学習（一問一答）画面の制御
// ============================================================================
function switchView(viewId) {
  ['home-view', 'study-view', 'result-view'].forEach(id => {
    const el = document.getElementById(id);
    if (id === viewId) {
      el.classList.remove('hidden');
      el.classList.add('flex');
    } else {
      el.classList.add('hidden');
      el.classList.remove('flex');
    }
  });
  window.scrollTo(0, 0);
}

function startStudy(deckKey, title, questions, forceNoShuffle = false) {
  if (!questions || questions.length === 0) {
    showToast('出題できる問題がありません');
    return;
  }
  const ordered = (!forceNoShuffle && appState.settings.order === 'random')
    ? shuffleArray(questions)
    : [...questions];

  session = {
    deckKey,
    title,
    queue: ordered,
    index: 0,
    revealed: false,
    correctCount: 0,
    wrongIds: []
  };

  appState.lastStudied[deckKey] = Date.now();
  saveState();

  document.getElementById('study-title').textContent = title;
  switchView('study-view');
  renderCurrentQuestion();
}

function renderCurrentQuestion() {
  const total = session.queue.length;
  const current = session.queue[session.index];
  session.revealed = false;

  // プログレス更新
  document.getElementById('study-progress-text').textContent = `${session.index + 1} / ${total}`;
  document.getElementById('study-progress-bar').style.width = `${((session.index) / total) * 100}%`;

  // バッジ更新
  const typeBadge = document.getElementById('q-type-badge');
  if (current.level === 'basic') {
    typeBadge.textContent = '基本問題';
    typeBadge.className = 'px-2.5 py-1 rounded-full font-bold bg-blue-100 text-blue-700';
  } else if (current.level === 'std') {
    typeBadge.textContent = '標準問題';
    typeBadge.className = 'px-2.5 py-1 rounded-full font-bold bg-indigo-100 text-indigo-700';
  } else {
    typeBadge.textContent = '資料問題';
    typeBadge.className = 'px-2.5 py-1 rounded-full font-bold bg-amber-100 text-amber-800';
  }

  document.getElementById('q-unit-badge').textContent = current.unitTitle;

  const reviewTag = document.getElementById('q-review-tag');
  if (appState.reviewSet[current.id]) {
    reviewTag.classList.remove('hidden');
  } else {
    reviewTag.classList.add('hidden');
  }

  // スター状態
  updateStarIcon(current.id);

  // 史料ボックス（資料問題のみ）
  const srcBox = document.getElementById('q-source-box');
  if (current.source) {
    srcBox.textContent = current.source;
    srcBox.classList.remove('hidden');
  } else {
    srcBox.classList.add('hidden');
    srcBox.textContent = '';
  }

  // 問題文・解答セット
  document.getElementById('q-text').textContent = current.q;
  document.getElementById('a-text').textContent = current.a;

  const noteEl = document.getElementById('a-note');
  if (current.note) {
    noteEl.textContent = `💡 解説：${current.note}`;
    noteEl.classList.remove('hidden');
  } else {
    noteEl.classList.add('hidden');
    noteEl.textContent = '';
  }

  // 答えエリアを未表示状態へ
  document.getElementById('answer-placeholder').classList.remove('hidden');
  document.getElementById('answer-revealed').classList.add('hidden');
  document.getElementById('pre-answer-actions').classList.remove('hidden');
  document.getElementById('post-answer-actions').classList.add('hidden');

  // 前の問題ボタンの活性制御
  const prevBtn = document.getElementById('btn-prev-q');
  prevBtn.disabled = session.index === 0;
  prevBtn.classList.toggle('opacity-40', session.index === 0);
}

function revealAnswer() {
  if (session.revealed) return;
  session.revealed = true;
  document.getElementById('answer-placeholder').classList.add('hidden');
  document.getElementById('answer-revealed').classList.remove('hidden');
  document.getElementById('pre-answer-actions').classList.add('hidden');
  document.getElementById('post-answer-actions').classList.remove('hidden');
}

function judgeAnswer(isCorrect) {
  const current = session.queue[session.index];
  if (isCorrect) {
    session.correctCount++;
    appState.correctMap[current.id] = (appState.correctMap[current.id] || 0) + 1;
    if (appState.settings.autoRemoveReview && appState.reviewSet[current.id]) {
      delete appState.reviewSet[current.id];
    }
  } else {
    if (!session.wrongIds.includes(current.id)) {
      session.wrongIds.push(current.id);
    }
    appState.reviewSet[current.id] = true;
  }

  appState.lastStudied[session.deckKey] = Date.now();
  saveState();

  if (session.index + 1 < session.queue.length) {
    session.index++;
    renderCurrentQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('study-progress-bar').style.width = '100%';
  document.getElementById('result-subtitle').textContent = `${session.title}（全${session.queue.length}問）`;
  document.getElementById('res-correct').textContent = session.correctCount;
  document.getElementById('res-wrong').textContent = session.wrongIds.length;

  const retryWrongBtn = document.getElementById('btn-retry-wrong');
  if (session.wrongIds.length > 0) {
    retryWrongBtn.classList.remove('hidden');
    retryWrongBtn.textContent = `間違えた ${session.wrongIds.length} 問だけやり直す`;
  } else {
    retryWrongBtn.classList.add('hidden');
  }

  switchView('result-view');
}

function updateStarIcon(qId) {
  const icon = document.getElementById('star-icon');
  if (appState.starSet[qId]) {
    icon.textContent = '★';
    icon.className = 'text-amber-400';
  } else {
    icon.textContent = '☆';
    icon.className = 'text-slate-300';
  }
}

// ============================================================================
// 設定モーダル制御
// ============================================================================
function syncSettingsUI() {
  document.querySelectorAll('.setting-btn').forEach(btn => {
    const key = btn.dataset.setting;
    const val = btn.dataset.val;
    const isActive = appState.settings[key] === val;
    btn.className = `setting-btn py-2.5 rounded-xl border font-semibold transition-all ${
      isActive
        ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
        : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
    }`;
  });
  document.getElementById('chk-auto-remove').checked = !!appState.settings.autoRemoveReview;
}

// ============================================================================
// 検索モーダル制御
// ============================================================================
function runSearch(keyword) {
  const container = document.getElementById('search-results');
  const meta = document.getElementById('search-meta');
  const kw = keyword.trim().toLowerCase();

  if (!kw) {
    meta.textContent = `全${ALL_QUESTIONS.length}問から検索できます（タップで答え表示）`;
    container.innerHTML = '';
    return;
  }

  const hits = ALL_QUESTIONS.filter(item =>
    item.q.toLowerCase().includes(kw) ||
    item.a.toLowerCase().includes(kw) ||
    item.source.toLowerCase().includes(kw) ||
    item.unitTitle.toLowerCase().includes(kw)
  );

  meta.textContent = `${hits.length}件ヒット（最大100件表示・カードをタップで答え切替）`;
  container.innerHTML = '';

  hits.slice(0, 100).forEach(item => {
    const row = document.createElement('div');
    row.className = 'p-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50/60 border border-slate-200 cursor-pointer transition-colors';

    const badge = item.level === 'basic' ? '基本' : item.level === 'std' ? '標準' : '資料';
    const badgeCls = item.level === 'source'
      ? 'bg-amber-100 text-amber-800'
      : item.level === 'std' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700';

    row.innerHTML = `
      <div class="flex items-center justify-between gap-2 mb-1">
        <span class="text-[11px] font-semibold text-slate-500">${item.unitTitle}</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeCls}">${badge}</span>
      </div>
      ${item.source ? `<div class="text-[11px] text-amber-900 bg-amber-50 p-2 rounded-lg mb-1.5 whitespace-pre-line">${item.source}</div>` : ''}
      <div class="text-sm font-semibold text-slate-800 leading-snug">${item.q}</div>
      <div class="search-ans hidden mt-2 pt-2 border-t border-dashed border-slate-300 text-sm font-extrabold text-rose-600">
        A. ${item.a}
        ${item.note ? `<div class="text-xs font-normal text-slate-600 mt-1">${item.note}</div>` : ''}
      </div>
      <div class="search-hint mt-1.5 text-[11px] text-blue-500 font-medium">タップして答えを表示 ▾</div>
    `;

    row.addEventListener('click', () => {
      const ans = row.querySelector('.search-ans');
      const hint = row.querySelector('.search-hint');
      const hidden = ans.classList.toggle('hidden');
      hint.textContent = hidden ? 'タップして答えを表示 ▾' : 'タップして答えを隠す ▴';
    });
    container.appendChild(row);
  });
}

// ============================================================================
// イベントリスナー登録＆初期化
// ============================================================================
function initEvents() {
  // 表示モード切替（単元ごと / 章ごと）
  document.getElementById('mode-unit').addEventListener('click', () => {
    appState.groupMode = 'unit';
    saveState();
    renderHome();
  });
  document.getElementById('mode-chapter').addEventListener('click', () => {
    appState.groupMode = 'chapter';
    saveState();
    renderHome();
  });

  // フッターの左右タブ移動
  const stepTab = (delta) => {
    const idx = TABS.findIndex(t => t.id === appState.activeTab);
    const nextIdx = (idx + delta + TABS.length) % TABS.length;
    appState.activeTab = TABS[nextIdx].id;
    saveState();
    renderHome();
  };
  document.getElementById('btn-prev-tab').addEventListener('click', () => stepTab(-1));
  document.getElementById('btn-next-tab').addEventListener('click', () => stepTab(1));

  // 学習画面の操作
  document.getElementById('btn-back-home').addEventListener('click', () => {
    switchView('home-view');
    renderHome();
  });

  // カード全体タップ or 答えを見るボタンで答え表示
  document.getElementById('flashcard').addEventListener('click', () => {
    if (!session.revealed) revealAnswer();
  });
  document.getElementById('btn-show-ans').addEventListener('click', revealAnswer);

  document.getElementById('btn-prev-q').addEventListener('click', () => {
    if (session.index > 0) {
      session.index--;
      renderCurrentQuestion();
    }
  });

  document.getElementById('btn-correct').addEventListener('click', () => judgeAnswer(true));
  document.getElementById('btn-wrong').addEventListener('click', () => judgeAnswer(false));

  // マイリスト（☆）切替
  document.getElementById('btn-toggle-star').addEventListener('click', () => {
    const current = session.queue[session.index];
    if (!current) return;
    if (appState.starSet[current.id]) {
      delete appState.starSet[current.id];
      showToast('マイリストから解除しました');
    } else {
      appState.starSet[current.id] = true;
      showToast('マイリストに登録しました ★');
    }
    saveState();
    updateStarIcon(current.id);
  });

  // 結果画面ボタン
  document.getElementById('btn-retry-wrong').addEventListener('click', () => {
    const wrongQs = session.wrongIds.map(id => QUESTION_MAP[id]).filter(Boolean);
    startStudy(session.deckKey, `${session.title}（復習）`, wrongQs);
  });
  document.getElementById('btn-retry-all').addEventListener('click', () => {
    startStudy(session.deckKey, session.title, session.queue);
  });
  document.getElementById('btn-result-home').addEventListener('click', () => {
    switchView('home-view');
    renderHome();
  });

  // 設定モーダル
  const settingsModal = document.getElementById('settings-modal');
  document.getElementById('btn-settings').addEventListener('click', () => {
    syncSettingsUI();
    document.getElementById('reset-confirm-box').classList.add('hidden');
    settingsModal.classList.remove('hidden');
  });
  document.getElementById('btn-close-settings').addEventListener('click', () => {
    settingsModal.classList.add('hidden');
    renderHome();
  });
  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) {
      settingsModal.classList.add('hidden');
      renderHome();
    }
  });

  document.querySelectorAll('.setting-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      appState.settings[btn.dataset.setting] = btn.dataset.val;
      saveState();
      syncSettingsUI();
    });
  });

  document.getElementById('chk-auto-remove').addEventListener('change', (e) => {
    appState.settings.autoRemoveReview = e.target.checked;
    saveState();
  });

  document.getElementById('btn-ask-reset').addEventListener('click', () => {
    document.getElementById('reset-confirm-box').classList.remove('hidden');
  });
  document.getElementById('btn-cancel-reset').addEventListener('click', () => {
    document.getElementById('reset-confirm-box').classList.add('hidden');
  });
  document.getElementById('btn-do-reset').addEventListener('click', () => {
    appState.correctMap = {};
    appState.reviewSet = {};
    appState.starSet = {};
    appState.lastStudied = {};
    saveState();
    document.getElementById('reset-confirm-box').classList.add('hidden');
    settingsModal.classList.add('hidden');
    renderHome();
    showToast('学習記録をリセットしました');
  });

  // 検索モーダル
  const searchModal = document.getElementById('search-modal');
  const searchInput = document.getElementById('search-input');
  document.getElementById('btn-search').addEventListener('click', () => {
    searchModal.classList.remove('hidden');
    runSearch(searchInput.value);
    setTimeout(() => searchInput.focus(), 80);
  });
  document.getElementById('btn-close-search').addEventListener('click', () => {
    searchModal.classList.add('hidden');
  });
  searchModal.addEventListener('click', (e) => {
    if (e.target === searchModal) searchModal.classList.add('hidden');
  });
  searchInput.addEventListener('input', (e) => runSearch(e.target.value));

  // PC向けキーボード操作（Space/Enterで答え表示、1/←で×、2/→で○）
  document.addEventListener('keydown', (e) => {
    const inStudy = !document.getElementById('study-view').classList.contains('hidden');
    if (!inStudy) return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!session.revealed) revealAnswer();
    } else if (session.revealed) {
      if (e.key === 'ArrowLeft' || e.key === '1') judgeAnswer(false);
      if (e.key === 'ArrowRight' || e.key === '2') judgeAnswer(true);
    }
  });
}

// アプリ起動
window.addEventListener('DOMContentLoaded', () => {
  parseDatabases();
  ALL_QUESTIONS.forEach(q => { QUESTION_MAP[q.id] = q; });
  initEvents();
  renderHome();
});
</script>
